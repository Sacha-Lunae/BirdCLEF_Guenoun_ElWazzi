version: "3.8"

services:
  ###########################################################################
  # POSTGRES
  ###########################################################################
  postgres:
    image: postgres:14
    container_name: postgres
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=maindb
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d maindb"]
      interval: 10s
      retries: 5
      start_period: 5s
    volumes:
      - postgres_data:/var/lib/postgresql/data

  ###########################################################################
  # MONGODB
  ###########################################################################
  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh mongodb://localhost:27017/test --quiet
      interval: 10s
      retries: 5
      start_period: 5s

    volumes:
      - mongo_data:/data/db

  ###########################################################################
  # MINIO
  ###########################################################################
  minio:
    image: minio/minio
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "9000:9000"   # MinIO S3-compatible API
      - "9001:9001"   # MinIO console UI
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      retries: 5
      start_period: 5s
    volumes:
      - minio_data:/data
  ###########################################################################
  # MINIO SETUP (Bucket creation)
  ###########################################################################
  minio-setup:
    image: minio/mc
    container_name: minio-setup
    depends_on:
      - minio
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      echo '--- Waiting 10s for MinIO to be ready...';
      sleep 10;

      echo '--- Creating buckets...';
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb --region=us-east-1 myminio/raw-bucket || echo 'raw-bucket already exists';
      mc mb --region=us-east-1 myminio/staging-bucket || echo 'staging-bucket already exists';
      mc mb --region=us-east-1 myminio/curated-bucket || echo 'curated-bucket already exists';

      echo '--- Buckets created/verified. Exiting now.';
      "

    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin

  ###########################################################################
  # AIRFLOW
  ###########################################################################

  airflow:
    build:
      context: .
      dockerfile: ./DockerFiles/Airflow/Dockerfile.airflow
    container_name: airflow
    depends_on:
      - postgres
      - mongodb
      - minio
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://admin:admin@postgres:5432/maindb
      - AIRFLOW__CORE__FERNET_KEY=GH6NOdg_nafT5exv5AD33vQD-nNRnV2HfFFut7nToeE=
      - AIRFLOW__WEBSERVER__SECRET_KEY=some_random_secret_key
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__CORE__DEFAULT_TIMEZONE=UTC
      - AIRFLOW__WEBSERVER__WEB_SERVER_HOST=0.0.0.0
      - AIRFLOW__WEBSERVER__WEB_SERVER_PORT=8080
      - AIRFLOW__API__AUTH_BACKENDS=airflow.api.auth.backend.basic_auth

    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins

  ###########################################################################
  # API FLASK
  ###########################################################################
  api:
    build:
      context: ./DockerFiles/api
      dockerfile: Dockerfile.api
    
    container_name: flask_api
    depends_on:
      - postgres
      - mongodb
      - minio
    ports:
      - "8000:8000"
    environment:
      # Variables pour la connexion à MinIO
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin

      # Variables pour la connexion à PostgreSQL
      - POSTGRES_URI=postgresql+psycopg2://admin:admin@postgres:5432/maindb

      # Variables pour la connexion à Mongo
      - MONGO_URI=mongodb://mongodb:27017

volumes:
  postgres_data:
  mongo_data:
  minio_data:
